<!DOCTYPE html>
<html lang="$if(lang)$$lang$$else$en$endif$">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="generator" content="pandoc">
<title>$if(title-prefix)$$title-prefix$ – $endif$$if(pagetitle)$$pagetitle$$else$Tensorspine reference catalog$endif$</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
$for(css)$
<link rel="stylesheet" href="$css$">
$endfor$
$for(header-includes)$
$header-includes$
$endfor$
</head>
<body>
$for(include-before)$
$include-before$
$endfor$
<div class="page">
<aside class="nav">
  <label class="search">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
    <input type="search" id="nav-filter" placeholder="Filter units" autocomplete="off">
  </label>
$if(toc)$
<nav id="TOC" aria-label="Contents">
$table-of-contents$
</nav>
$endif$
</aside>
<div class="content">
<main>
$body$
</main>
<nav class="rail" id="rail"></nav>
</div>
</div>
<script>
(function () {
  // --- Sidebar filter: hide TOC entries that do not match the query.
  var toc = document.getElementById('TOC');
  var input = document.getElementById('nav-filter');
  if (toc && input) {
    var items = Array.prototype.slice.call(toc.querySelectorAll('li'));
    input.addEventListener('input', function () {
      var q = input.value.trim().toLowerCase();
      items.forEach(function (li) {
        var own = li.textContent.toLowerCase();
        li.classList.toggle('hidden', q !== '' && own.indexOf(q) === -1);
      });
    });
  }

  // --- Sidebar unit entries: drop the namespace the parent entry already names.
  if (toc) {
    Array.prototype.forEach.call(toc.querySelectorAll('li > ul > li > a'), function (a) {
      var ns = a.parentNode.parentNode.parentNode.querySelector(':scope > a');
      var nsName = ns ? ns.textContent.trim().replace(/\.\*$$/, '') : '';
      var code = a.querySelector('code') || a;
      if (nsName && code.textContent.indexOf(nsName + '.') === 0) {
        code.textContent = code.textContent.slice(nsName.length + 1);
      }
    });
  }

  // --- Right rail: the h5 subsections of the contract (level-4 section) in view.
  var rail = document.getElementById('rail');
  var contracts = Array.prototype.slice.call(document.querySelectorAll('section.level4'));
  var tocLinks = toc ? Array.prototype.slice.call(toc.querySelectorAll('a[href^="#"]')) : [];
  var current = null;

  function renderRail(sec) {
    if (!rail) return;
    var subs = sec ? Array.prototype.slice.call(sec.querySelectorAll(':scope > section.level5 > h5')) : [];
    if (!subs.length) { rail.innerHTML = ''; return; }
    var html = '<div class="label">On this page</div><ul>';
    subs.forEach(function (h) {
      html += '<li><a href="#' + h.parentNode.id + '">' + h.textContent + '</a></li>';
    });
    rail.innerHTML = html + '</ul>';
  }

  function topmost(list) {
    var best = null, bestTop = -Infinity, line = 120;
    list.forEach(function (el) {
      var top = el.getBoundingClientRect().top;
      if (top <= line && top > bestTop) { best = el; bestTop = top; }
    });
    return best;
  }

  function update() {
    var sec = topmost(contracts);
    if (sec !== current) { current = sec; renderRail(sec); }
    // active subsection
    if (sec && rail) {
      var subs = Array.prototype.slice.call(sec.querySelectorAll(':scope > section.level5'));
      var active = topmost(subs);
      Array.prototype.forEach.call(rail.querySelectorAll('a'), function (a) {
        a.classList.toggle('active', !!active && a.getAttribute('href') === '#' + active.id);
      });
    }
    // active sidebar entry: deepest section whose heading is above the fold
    var all = Array.prototype.slice.call(document.querySelectorAll('section[id]'));
    var here = topmost(all);
    var chain = [];
    while (here && here.tagName === 'SECTION') { chain.push('#' + here.id); here = here.parentNode; }
    tocLinks.forEach(function (a) {
      a.classList.toggle('active', chain.indexOf(a.getAttribute('href')) !== -1);
    });
  }

  var ticking = false;
  window.addEventListener('scroll', function () {
    if (!ticking) { ticking = true; requestAnimationFrame(function () { update(); ticking = false; }); }
  }, { passive: true });
  window.addEventListener('resize', update);
  update();
})();
</script>
</body>
</html>
